name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Format check (new trading code only)
        run: black --check src/trading tests
      - name: Lint (errors only, new trading code)
        run: pylint --errors-only src/trading tests
      - name: Tests
        run: pytest
