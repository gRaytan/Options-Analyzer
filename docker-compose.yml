# Always-on deployment (spec §15): IB Gateway + trading engine + web UI.
#
#   cp deploy/gateway.env.example deploy/gateway.env   # IB login (never commit)
#   cp .env.example .env                               # account ID etc.
#   docker compose up -d
#
# Nothing is exposed to the internet: every published port binds to
# 127.0.0.1. Reach the web UI and the Gateway VNC screen over a VPN such as
# Tailscale, or an SSH tunnel.

services:
  ib-gateway:
    # IB Gateway + IBC (auto-login, daily restart). Pinned; see deploy/README.md.
    image: ghcr.io/gnzsnz/ib-gateway:10.50.1f
    restart: unless-stopped
    env_file: deploy/gateway.env
    environment:
      READ_ONLY_API: "yes"  # IB-side order block; keep "yes" through Stage 2
      TIME_ZONE: America/New_York
    ports:
      - "127.0.0.1:5900:5900"  # VNC, to watch the Gateway or approve prompts
    volumes:
      - gateway-settings:/home/ibgateway/tws_settings

  trading-engine:
    build: .
    restart: unless-stopped
    depends_on: [ib-gateway]
    env_file: .env
    environment:
      IB_HOST: ib-gateway
      # Inside the compose network the gateway image relays the API:
      # 4004 = paper, 4003 = live.
      IB_PORT: "4004"
      IB_CLIENT_ID: "1"
    volumes:
      - ./data:/app/data
    healthcheck:
      # The engine touches this file every loop; stale for 5 min = unhealthy.
      test: ["CMD-SHELL", "find /app/data/trading/heartbeat -mmin -5 | grep -q ."]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s

  web-ui:
    build: .
    restart: unless-stopped
    command: ["python", "run.py"]
    env_file: .env
    environment:
      DEBUG: "false"
      PORT: "5000"
      IB_HOST: ib-gateway
      IB_PORT: "4004"
      IB_CLIENT_ID: "2"
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./data:/app/data

volumes:
  gateway-settings:
